name: Dev Build

# Builds the plugin for every supported Minecraft version on every push to
# master and publishes the jars as a rolling pre-release tagged "dev".

on:
  push:
    branches: [ master ]

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    name: Build MC ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.16.5",  java: "8"  }
          - { mc: "1.17.1",  java: "16" }
          - { mc: "1.18.2",  java: "17" }
          - { mc: "1.19.4",  java: "17" }
          - { mc: "1.20.4",  java: "17" }
          - { mc: "1.20.6",  java: "21" }
          - { mc: "1.21.4",  java: "21" }
          - { mc: "1.21.11", java: "21" }
          - { mc: "26.3",    java: "21" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute dev version
        run: |
          BASE=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout)
          echo "VERSION=${BASE}-dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build
        run: >
          mvn -B --no-transfer-progress clean package
          -Drevision=${{ env.VERSION }}
          -Dspigot.version=${{ matrix.mc }}
          -Djava.release=${{ matrix.java }}

      - uses: actions/upload-artifact@v4
        with:
          name: Blood-mc${{ matrix.mc }}
          path: target/Blood-*.jar

  release:
    name: Publish dev release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
          merge-multiple: true

      - name: Publish rolling pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="dev"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" jars/*.jar \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build (${GITHUB_SHA::7})" \
            --notes "Automatic development build of master at commit $GITHUB_SHA. Not a stable release. Pick the jar matching your server's Minecraft version."
